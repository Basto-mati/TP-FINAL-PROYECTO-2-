<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego - Papu Besti</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/detalle.css">
</head>
<body>

<header>
    <nav class="barra-navegadora">
        <div class="logo-PapuBestie">Papu Besti</div>
        <div class="contenedor-menu">
            <a class="item-menu" href="index.html">Store</a>
            <a class="item-menu" href="wishlist.html">Wishlist</a>
            <a class="item-menu" href="mejorValorados.html">Mejores Juegos</a>
            <a class="item-menu" href="acerca.html">Acerca de nosotros</a>
        </div>
    </nav>
</header>

<main class="detalle">
  <section class="detalle-medios" aria-label="Imagen del juego">
    <img id="juegoImagen" class="imagen-principal" alt="">
  </section>

  <section class="detalle-informacion">
    <h1 id="juegoNombre"></h1>
    <p id="juegoCategoria" class="juego-categoria"></p>
    <p id="juegoDescripcion"></p>
  </section>

  <section class="seccion-resenas" aria-labelledby="tituloResenas">
    <h2 id="tituloResenas">Reseñas</h2>
    <form id="formResena">
      <label for="textoResena">Escribí tu reseña</label>
      <textarea id="textoResena" rows="4" required></textarea>
      <button type="submit">Publicar reseña</button>
      <p id="mensajeResena" aria-live="polite"></p>
    </form>
    <div id="listaResenas" aria-live="polite"></div>
  </section>
</main>

<script src="js/juegos.js"></script>
<script src="js/detalle.js"></script>
<script src="js/CambColor.js"></script>
<script src="js/cuenta.js"></script>
</body>
</html>
